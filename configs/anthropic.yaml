# Anthropic setup: mid-tier model for misses, small model for patching.
# export ANTHROPIC_API_KEY=sk-ant-...
# gistcache --config configs/anthropic.yaml serve --port 8100
providers:
  large:
    kind: anthropic
    model: claude-sonnet-5-5
    api_key_env: ANTHROPIC_API_KEY
  small:
    kind: anthropic
    model: claude-haiku-5-5
    api_key_env: ANTHROPIC_API_KEY

embedder:
  model: sentence-transformers/all-MiniLM-L6-v2
  device: cpu

verifier:
  cross_encoder: cross-encoder/quora-distilroberta-base
  hit_threshold: 0.90
  near_threshold: 0.70
  top_k: 5
  strict_content_check: true   # refuse a plain hit when one query adds/drops content no rule explains
  nli_guard: cross-encoder/nli-deberta-v3-small   # veto hits whose queries contradict each other
  contradiction_threshold: 0.5
  borderline_judge: true       # second opinion on unsure pairs. Validated on small samples (see README):
                               # recovered 8/8 band paraphrases, 0/1 near-miss passed; stress test 0/24 near-misses passed
  borderline_low: 0.3          # lowest cross-encoder score that is still worth asking about

patcher:
  enabled: true
  max_length_ratio: 1.5
  cache_patched_answers: false
  prompt: v2                   # v2 = pure reformatting is allowed (default); v1 = the strict original

cache:
  path: ./data/gistcache.db
  max_entries: 100000
  default_ttl_seconds: null
  volatility_check: true       # one small-model call per stored answer; skips caching answers that go stale.
                               # Validated: python -m eval.volatility caught 14/14 volatile, 0/14 stable flagged

bypass:
  max_temperature: 0.7
  with_tools: true

multi_turn:
  context_turns: 4

# USD per 1M tokens, from platform.claude.com/docs/en/about-claude/pricing (checked 2026-10-20).
pricing:
  large: { input: 2.0, output: 10.0 }   # claude-sonnet-5-5
  small: { input: 0.10, output: 0.50 }  # claude-haiku-5-5
